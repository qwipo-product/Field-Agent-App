<GridLayout rows="*,auto" class="bg-searchBg">
    <StackLayout rows="*,*">
        <StackLayout row="0" orientation="horizontal" class="p-2" (tap)="goBack()">
            <Label text="&#xf053;" class="back-arrow"></Label>
            <Label text="Reason For attempt" class="title" *ngIf="actionType == 1"></Label>
            <Label text="Reason For Return" class="title" *ngIf="actionType == 2"></Label>
        </StackLayout>
        <StackLayout row="1" rows="*,auto" verticalAlignment="top">
            <ScrollView height = 100%>
            <GridLayout row="0" rows="auto,auto,*">
                <StackLayout row="0" rows="auto,auto" class="bg-searchBg border-1-grey pl-4 mt-4 mx-5"
                    (tap)="openReturnRequestList()">
                    <StackLayout row="0" orientation="horizontal">
                        <label text="Reason" class="text-sz-12 text-label pt-2" textWrap="true"></label>
                        <label text="&#xf069;" class="fas text-sz-10 pt-2 pl-1"></label>
                    </StackLayout>
                    <GridLayout rows="auto" class="pt-5">
                        <StackLayout col="1" class="pt-2 pr-1 pb-1">
                            <Label class="text-black text-sz-14 bg-searchBg mb-2" *ngIf="!isSelectedReason"
                                verticalAlignment="center" text="Select Reason for Return" row="0" col="1"
                                returnKeyType="done">
                            </Label>
                            <Label class="text-black text-sz-14 bg-searchBg mb-2" *ngIf="isSelectedReason"
                                verticalAlignment="center" [text]="selectedReason.name" row="0" col="1"
                                returnKeyType="done">
                            </Label>
                        </StackLayout>
                    </GridLayout>
                </StackLayout>
                <StackLayout row="1" class="mx-5 bg-searchBg border-1-grey mt-2" height="400"
                    *ngIf="showReturnRequestList">
                    <ScrollView height="100%">
                        <StackLayout verticalAlignment="center">
                            <GridLayout rows="50" columns="auto,5,*" verticalAlignment="center"
                                class="p-1 border-b-2 border-gray-200 px-5" *ngFor="let return of returns">
                                <StackLayout row="0" col="0" verticalAlignment="center" horizontalAlignment="center"
                                    (tap)="selectSubFilter(return)">
                                    <label [text]="return.name" class="text-black text-left text-sz-14"
                                        textWrap="true"></label>
                                </StackLayout>
                                <StackLayout row="0" col="2" verticalAlignment="center" horizontalAlignment="right"
                                    (tap)="selectSubFilter(return)" class="mr-5">
                                    <SVGImage src="~/images/redesign/icons/radio-selected.svg" *ngIf="return.isSelected"
                                        class="w-4 h-4">
                                    </SVGImage>
                                    <SVGImage src="~/images/redesign/icons/radio-before.svg" *ngIf="!return.isSelected"
                                        class="w-4 h-4">
                                    </SVGImage>

                                </StackLayout>
                            </GridLayout>
                        </StackLayout>
                    </ScrollView>
                </StackLayout>
                <StackLayout row="2" *ngIf="(actionType == 2 && selectedReason?.id == 15) || actionType == 1"
                    orientation=vertical>
                    <GridLayout verticalAlignment="center" (tap)="selectImage(1,imagesToUpload.shop_image.path)"
                        height="150" class="mt-5 mx-5 border-1-grey rounded-lg">
                        <StackLayout class="pt-5">
                            <label text="Shop Image in .jpg .png format" class="text-sz-16"
                                horizontalAlignment="center"></label>
                            <StackLayout class="pt-5">
                                <SVGImage src="~/images/redesign/icons/upload.svg" class="h-6 w-6"
                                    horizontalAlignment="center">
                                </SVGImage>
                            </StackLayout>
                            <label text="Capture Document" *ngIf="!imagesToUpload.shop_image.name"
                                class="text-sz-14 text-underline pt-5" horizontalAlignment="center"></label>
                            <label text="Change Image Browse" *ngIf="imagesToUpload.shop_image.name"
                                class="text-sz-14 text-underline text-black pt-5" horizontalAlignment="center"></label>
                        </StackLayout>
                    </GridLayout>
                    <FlexboxLayout flexDirection="row" height="40"
                        class="bg-white rounded-md mt-4 mx-5 justify-between border-1">
                        <FlexboxLayout class="justify-center items-center h-8 w-8">
                            <label text="&#xf1c5;" class="fas"></label>
                        </FlexboxLayout>
                        <FlexboxLayout flexDirection="row" class="items-center justify-center space-x-2">
                            <label text="file name" class="text-sz-14 font-sans text-black pr-4"
                                *ngIf="!imagesToUpload.shop_image.name"></label>
                            <label [text]="imagesToUpload.shop_image.name" *ngIf="imagesToUpload.shop_image.name"
                                class="text-sz-14 font-sans text-black pr-4"></label>
                        </FlexboxLayout>
                    </FlexboxLayout>
                </StackLayout>
            </GridLayout>
        </ScrollView>
        </StackLayout>
    </StackLayout>
    <GridLayout row="1" rows="*" height="70" orientation="vertical" horizontalAlignment="center"
        verticalAlignment="center" class="mt-2" *ngIf="isSubmitBtnEnable()">
        <StackLayout row="0" verticalAlignment="center">
            <Button text="Submit" class="primary-btn2 h-[70%]" (tap)="submit()"></Button>
        </StackLayout>
    </GridLayout>
</GridLayout>
